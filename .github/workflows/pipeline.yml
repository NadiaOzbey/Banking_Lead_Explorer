name: Lead Explorer CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lead_explorer_test
          POSTGRES_USER: lead_explorer
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U lead_explorer -d lead_explorer_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lead_explorer:local-test-only@127.0.0.1:55432/lead_explorer_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Scan Git history and tracked files for secrets
        run: |
          docker run --rm --volume "$PWD:/repo:ro" --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/repo ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 git /repo --log-opts=--all --redact
          docker run --rm --volume "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 dir /repo --redact
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - name: Audit dependencies
        run: |
          npm audit --omit=dev --audit-level=moderate
          status=0
          npm audit --audit-level=moderate --json > "$RUNNER_TEMP/npm-audit.json" || status=$?
          cat "$RUNNER_TEMP/npm-audit.json"
          node scripts/check-audit.mjs "$RUNNER_TEMP/npm-audit.json" "$status"
      - name: Build frontend and backend images
        run: |
          docker build --file api.Dockerfile --tag lead_explorer-api:ci .
          docker build --file web.Dockerfile --tag lead_explorer-web:ci .

  staging:
    name: Deploy staging
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_STAGING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency: lead-explorer-staging
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Deploy the verified commit to staging
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          DEPLOY_URL: ${{ vars.STAGING_URL }}
          DEPLOY_SHA: ${{ github.sha }}
        run: bash deploy/render.sh

  staging-check:
    name: Verify release on staging
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm this commit is live before requesting approval
        env:
          DEPLOY_URL: ${{ vars.STAGING_URL }}
          DEPLOY_SHA: ${{ github.sha }}
        run: bash deploy/smoke.sh

  production:
    name: Deploy production
    needs: staging-check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: lead-explorer-production
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Recheck staging after approval
        env:
          DEPLOY_URL: ${{ vars.STAGING_URL }}
          DEPLOY_SHA: ${{ github.sha }}
        run: bash deploy/smoke.sh
      - name: Deploy the approved commit to production
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          DEPLOY_URL: ${{ vars.PRODUCTION_URL }}
          DEPLOY_SHA: ${{ github.sha }}
        run: bash deploy/render.sh
