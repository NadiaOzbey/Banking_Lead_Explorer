services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lead_explorer
      POSTGRES_USER: lead_explorer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead_explorer -d lead_explorer"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    environment:
      DATABASE_URL: postgres://lead_explorer:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/lead_explorer
      APP_ORIGIN: https://localhost:8443
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 25
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  caddy-data:
